name: Release

# Applications install this gem from GitHub by tag:
#   gem "ms_graph_mailer", github: "VandaPharma/ms_graph_mailer", tag: "vX.Y.Z"
# Pushing a vX.Y.Z tag runs the specs and creates a GitHub release with the built .gem attached.
# Nothing is published to rubygems.org.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.8"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/ms_graph_mailer/version -e 'print MsGraphMailer::VERSION')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: bundle exec rake spec
      - run: gem build ms_graph_mailer.gemspec
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ms_graph_mailer-*.gem --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
